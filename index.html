<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>PONG</h1>
        <div class="scoreboard">
            <div class="score">
                <h2>Player</h2>
                <p id="playerScore">0</p>
            </div>
            <div class="score">
                <h2>Computer</h2>
                <p id="computerScore">0</p>
            </div>
        </div>
        
        <div class="settings">
            <label for="mode">Right paddle</label>
            <select id="mode">
                <option value="computer" selected>Computer</option>
                <option value="human">Player 2</option>
            </select>

            <label for="difficulty">Difficulty</label>
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="normal" selected>Normal</option>
                <option value="hard">Hard</option>
            </select>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div class="instructions">
            <p><strong>Controls:</strong></p>
            <p>🖱️ Move Mouse | ⬆️ ⬇️ Arrow Keys | 👆 Drag on the board</p>
            <p>⏸️ <strong>P</strong> or <strong>Esc</strong> to pause</p>
            <p>Player 2: <strong>W</strong> / <strong>S</strong> — switch the right paddle above</p>
            <p><strong>First to 5 points wins!</strong> Press Space — or tap the board — to play again.</p>
        </div>
    </div>

    <!-- The rules first: game.js reads window.ENGINE as it starts. -->
    <script src="engine.js"></script>
    <script src="game.js"></script>
</body>
</html>
